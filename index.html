ize:17px;font-weight:550}.salon{font-size:12px;color:var(--green)}.entry p{margin:12px 0 0;font-size:13px;color:#626c64;white-space:pre-wrap;overflow-wrap:anywhere}.entry-foot{display:flex;justify-content:space-between;align-items:center;margin-top:13px;padding-top:10px;border-top:1px solid #efede7;color:var(--muted);font-size:11px}.actions{display:flex;gap:5px;flex-shrink:0}.actions button,.subtle{border:0;background:transparent;color:var(--muted);font-size:12px;padding:5px}.empty{padding:30px 18px;text-align:center;border:1px dashed #cbc9be;border-radius:14px;color:var(--muted);font-size:13px}.empty b{display:block;color:var(--ink);font:20px var(--serif);margin-bottom:8px}.privacy{margin-top:28px;background:#ece8df;padding:15px;border-radius:12px;font-size:11px;color:#667067}.privacy strong{color:var(--green)}.manage{display:flex;justify-content:center;gap:16px;margin:16px 0}.manage button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:11px}.modal{position:fixed;inset:0;background:#17231dcc;display:none;align-items:flex-end;justify-content:center;z-index:5;padding:0}.modal.open{display:flex}.sheet{background:var(--paper);width:min(100%,560px);max-height:94dvh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom))}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sheet h2{font:400 24px var(--serif);margin:0}.close{border:0;background:none;font-size:24px;color:var(--muted)}.field{margin:12px 0}.field label{display:block;font-size:12px;margin-bottom:6px;color:#566258}.field input,.field textarea,.field select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px 12px;color:var(--ink)}.field textarea{min-height:76px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{width:100%;border:0;background:var(--green);color:white;padding:14px;border-radius:11px;margin-top:8px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#26332d;color:white;padding:10px 16px;border-radius:30px;font-size:12px;display:none;z-index:9;max-width:90%;text-align:center}.toast.show{display:block}.people-area{margin:0 0 30px}.group-title{font:400 15px var(--serif);color:var(--green);padding:8px 3px 2px;border-bottom:1px solid var(--line)}.person-card{background:var(--card);border:1px solid #ebe8df;border-radius:14px;padding:15px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:9px}.person-card strong{font-size:15px}.person-card small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.person-actions{display:flex;align-items:center;gap:3px;flex-shrink:0}.person-actions button{border:0;background:transparent;color:var(--green);font-size:11px;padding:7px 5px}.person-actions .danger{color:#9a665b}.person-count{font-size:11px;color:var(--muted)}.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.photo-wrap{position:relative}.photo-wrap img{width:100%;height:160px;object-fit:cover;border-radius:10px;background:#eee}.photo-wrap button{position:absolute;right:5px;top:5px;background:#17231dcc;color:white;border:0;border-radius:30px;padding:5px 8px;font-size:11px}.photo-controls{display:flex;gap:8px}.photo-controls button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:10px 5px;color:var(--green);font-size:12px}.photo-note{font-size:10px;color:var(--muted);margin:5px 0}.person-detail{background:var(--accent);border-radius:12px;padding:13px 15px;margin-bottom:15px;font-size:12px;color:#536257}.person-detail strong{font:20px var(--serif);color:var(--ink);display:block}.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}.back{border:0;background:transparent;color:var(--green);padding:5px 0;font-size:12px}.detail-actions{display:flex;gap:5px}.detail-actions button{border:0;background:transparent;color:var(--green);font-size:12px}.hide{display:none!important}@media(min-width:620px){.wrap{padding-top:20px}.modal{align-items:center;padding:20px}.sheet{border-radius:20px}.summary{max-width:440px}.photo-wrap img{height:200px}}

ade" aria-hidden="true"></span></figure><div class="brand">HAIR <span>&amp;</span> MEMORIES</div><h1>髪を整え、心に晴れやかさを。</h1><p>✂ ご利用者さんのヘアカルテ ✂</p><div class="hero-divider" aria-hidden="true"></div></section>
<section class="people-area" id="peopleView"><div class="section-head"><h2>利用者</h2><button class="add" id="addPersonBtn">＋ 利用者を登録</button></div><div class="filters"><input id="personSearch" type="search" placeholder="名前・よみがなで検索"><select id="facilityFilter" aria-label="所属施設で絞り込み"><option value="">すべての施設</option></select></div><div id="peopleList" class="list"></div></section>

<aside class="privacy"><strong>🔒 あなたの端末だけに保存</strong><br>施設・利用者・記録・写真はこのブラウザの端末内に保存され、サーバーには送信されません。端末変更やブラウザのデータ消去に備えて、ときどき写真を含むバックアップを書き出してください。</aside><div class="manage"><button id="exportBtn">バックアップを書き出す</button><button id="importBtn">バックアップを読み込む</button><input id="fileInput" type="file" accept="application/json,.json" hidden></div><footer style="text-align:center;color:#9a9b91;font-size:10px;padding:5px">KAMI LOG · あなたの髪の小さなアーカイブ</footer></main>
<div class="modal" id="personModal" role="dialog" aria-modal="true"><form class="sheet" id="personForm"><div class="sheet-head"><h2 id="personFormTitle">利用者を登録</h2><button class="close" type="button" data-close="personModal">×</button></div><input id="personId" type="hidden"><div class="field"><label for="personName">名前 *</label><input id="personName" maxlength="60" required placeholder="例：佐倉 花子"></div><div class="field"><label for="personReading">よみがな（あいうえお順）</label><input id="personReading" maxlength="60" placeholder="例：さくら"></div><div class="field"><label for="personFacility">利用施設</label><input id="personFacility" list="facilityOptions" maxlength="100" placeholder="施設名を入力（任意）"><datalist id="facilityOptions"></datalist></div><div class="field"><label for="gender">性別</label><select id="gender"><option value="">選択してください</option><option>女性</option><option>男性</option><option>その他</option><option>回答しない</option></select></div><div class="field"><label for="birthDate">生年月日</label><input id="birthDate" type="text" inputmode="numeric" autocomplete="bday" maxlength="10" placeholder="例：19780603 または 1978-06-03"><small class="photo-note">数字8桁を続けて入力できます。</small></div><button class="save" type="submit">利用者情報を保存</button></form></div>
<div class="modal" id="cutModal" role="dialog" aria-modal="true"><form class="sheet" id="cutForm"><div class="sheet-head"><h2 id="cutFormTitle">カットの記録</h2><button class="close" type="button" data-close="cutModal">×</button></div><input id="cutId" type="hidden"><div class="field"><label for="cutPerson">利用者 *</label><select id="cutPerson" required></select></div><div class="field"><label for="cutDate">カットした日 *</label><input id="cutDate" type="date" required></div><div class="field"><label for="style">スタイル・メニュー *</label><input id="style" maxlength="80" required placeholder="例：ショートボブ、毛先を整える"></div><div class="grid"><div class="field"><label for="salon">サロン・担当者</label><input id="salon" maxlength="80" placeholder="例：〇〇美容室"></div><div class="field"><label for="price">料金（円）</label><input id="price" type="number" min="0" step="1" inputmode="numeric" placeholder="手入力"></div></div><div class="field"><label for="memo">メモ</label><textarea id="memo" maxlength="500" placeholder="気に入ったところ、次回の希望など"></textarea></div><div class="field"><label>写真</label><div class="photo-controls"><button type="button" id="cameraBtn">📷 カメラで撮る</button><button type="button" id="galleryBtn">▧ 写真を選ぶ</button></div><input id="cameraInput" type="file" accept="image/*" capture="environment" hidden><input id="galleryInput" type="file" accept="image/*" multiple hidden><div class="photo-note">枚数の上限はありません。写真は端末の空き容量の範囲で保存されます。追加後に×で取り消せます。</div><div id="photoPreview" class="photos"></div></div><button class="save" type="submit">記録を保存</button></form></div><div class="toast" id="toast"></div>
<script>
const DB_NAME='kami-log-local',DB_VERSION=1,STORE='app',KEY='state';let db,state={people:[],cuts:[],facilities:[]},activePersonId=null,draftPhotos=[];const $=id=>document.getElementById(id);const today=()=>new Date().toLocaleDateString('sv-SE');
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(Error('このブラウザでは端末保存を利用できません'));return}const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>req.result.createObjectStore(STORE);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}function readState(){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).get(KEY);req.onsuccess=()=>resolve(req.result||{people:[],cuts:[]});req.onerror=()=>reject(req.error)})}function saveState(){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(state,KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function age(birth){if(!birth)return'—';const b=new Date(birth+'T00:00:00'),n=new Date();if(Number.isNaN(b.getTime())||b>n)return'—';let a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return `${a}歳`}function normaliseBirthDate(raw){const s=String(raw||'').replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-65248)).trim();if(!s)return{value:'',error:''};let m=s.match(/^(\d{4})(\d{2})(\d{2})$/);if(m)return checkedBirthDate(`${m[1]}-${m[2]}-${m[3]}`);m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);if(m)return checkedBirthDate(`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`);return{value:'',error:'生年月日は YYYYMMDD（例：19780603）または YYYY-MM-DD で入力してください。'}}function checkedBirthDate(value){const [y,m,d]=value.split('-').map(Number),dt=new Date(y,m-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d)return{value:'',error:'実在する日付を入力してください。'};if(dt>new Date())return{value:'',error:'未来の日付は登録できません。'};return{value,error:''}}function pretty(d){if(!d)return'—';const [y,m,day]=d.split('-');return `${y}.${m}.${day}`}function notify(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2500)}function showModal(id){$(id).classList.add('open')}function closeModal(id){$(id).classList.remove('open')}
function facilityTone(name){return name.includes('ナーシングホーム')?'facility-nursing':name.includes('樹楽')?'facility-juraku':''}function facilityNameFor(p){return state.facilities.find(x=>x.id===p.facilityId)?.name||p.facilityName||''}function ensureFacility(name){const n=name.trim();if(!n)return'';let f=state.facilities.find(x=>x.name.toLocaleLowerCase()===n.toLocaleLowerCase());if(!f){f={id:crypto.randomUUID(),name:n};state.facilities.push(f)}return f.id}function render(){const q=$('personSearch').value.trim().toLocaleLowerCase();const facilityNames=[...new Set(state.people.map(facilityNameFor).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja',{sensitivity:'base'}));const selected=$('facilityFilter').value;$('facilityFilter').innerHTML='<option value="">すべての施設</option>'+facilityNames.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');if(facilityNames.includes(selected))$('facilityFilter').value=selected;const people=state.people.filter(p=>`${p.name} ${p.reading||''}`.toLocaleLowerCase().includes(q)&&(!$('facilityFilter').value||facilityNameFor(p)===$('facilityFilter').value)).sort((a,b)=>facilityNameFor(a).localeCompare(facilityNameFor(b),'ja',{sensitivity:'base'})||(a.reading||a.name).localeCompare(b.reading||b.name,'ja',{sensitivity:'base',numeric:true}));let html='',lastFacility=null;for(const p of people){const f=facilityNameFor(p)||'施設未設定';if(!$('facilityFilter').value&&f!==lastFacility){html+=`<div class="group-title ${facilityTone(f)}">${esc(f)}</div>`;lastFacility=f}html+=`<article class="person-card ${facilityTone(f)}"><div><strong>${esc(p.name)}</strong><small>${esc(p.gender||'性別未登録')} ・ ${p.birthDate?`${esc(p.birthDate)} / ${age(p.birthDate)}`:'生年月日未登録'} ・ ${esc(f)} ・ ${state.cuts.filter(c=>c.personId===p.id).length}件</small></div><div class="person-actions"><button data-open-person="${esc(p.id)}">記録を見る</button><button data-edit-person="${esc(p.id)}">編集</button><button class="danger" data-delete-person="${esc(p.id)}">削除</button></div></article>`} $('peopleList').innerHTML=html||`<div class="empty"><b>${q||$('facilityFilter').value?'該当する利用者がいません':'利用者を登録しましょう'}</b>${q||$('facilityFilter').value?'検索条件を変えてください':'自分やご家族を登録すると、カット記録を追加できます。'}</div>`;if(activePersonId)renderDetail()}function renderDetail(){const p=state.people.find(x=>x.id===activePersonId);if(!p){showPeople();return}const cuts=state.cuts.filter(c=>c.personId===p.id).sort((a,b)=>b.date.localeCompare(a.date));$('detailName').textContent=p.name;const pf=facilityNameFor(p);$('personInfo').innerHTML=`<strong>${esc(p.name)}${p.birthDate?` · ${age(p.birthDate)}`:''}</strong>${esc(p.gender||'性別未登録')}　${p.birthDate?`生年月日 ${esc(p.birthDate)}`:'生年月日未登録'}<br>施設：${esc(pf||'未設定')}`;const q=$('cutSearch').value.trim().toLocaleLowerCase();const shown=cuts.filter(c=>[c.style,c.salon,c.memo].join(' ').toLocaleLowerCase().includes(q));$('cutList').innerHTML=shown.length?shown.map(c=>`<article class="entry"><div class="entry-top"><div><div class="date">${pretty(c.date)}</div><h3>${esc(c.style)}</h3>${c.salon?`<div class="salon">${esc(c.salon)}</div>`:''}</div><div class="actions"><button data-edit-cut="${esc(c.id)}">編集</button><button data-delete-cut="${esc(c.id)}">削除</button></div></div>${c.memo?`<p>${esc(c.memo)}</p>`:''}${c.photos?.length?`<div class="photos">${c.photos.map((src,i)=>`<div class="photo-wrap"><img src="${src}" alt="${esc(c.style)}の写真 ${i+1}" loading="lazy"></div>`).join('')}</div>`:''}<div class="entry-foot"><span>${c.price!==''&&c.price!=null?`¥${Number(c.price).toLocaleString('ja-JP')}`:'料金未記入'}</span><span>${c.photos?.length||0}枚の写真</span></div></article>`).join(''):`<div class="empty"><b>${q?'見つかりませんでした':'記録はまだありません'}</b>${q?'別の言葉で検索してください':'この利用者のカット記録を追加できます。'}</div>`}
function showPeople(){activePersonId=null;$('peopleView').classList.remove('hide');$('detailView').classList.add('hide')}function showDetail(id){activePersonId=id;$('peopleView').classList.add('hide');$('detailView').classList.remove('hide');$('cutSearch').value='';renderDetail();window.scrollTo({top:0,behavior:'smooth'})}
function personForm(p){$('personForm').reset();$('personId').value=p?.id||'';$('personFormTitle').textContent=p?'利用者情報を編集':'利用者を登録';$('personName').value=p?.name||'';$('personReading').value=p?.reading||'';$('facilityOptions').innerHTML=[...new Set(state.people.map(facilityNameFor).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja')).map(n=>`<option value="${esc(n)}"></option>`).join('');$('personFacility').value=p?facilityNameFor(p):'';$('gender').value=p?.gender||'';$('birthDate').value=p?.birthDate||'';showModal('personModal')}function dataURL(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=()=>reject(fr.error);fr.readAsDataURL(file)})}async function shrinkImage(file){if(!file.type.startsWith('image/'))throw Error('画像ファイルを選んでください');if(file.size>25*1024*1024)throw Error('写真は1枚25MB以下にしてください');if(!('createImageBitmap'in window))return dataURL(file);const bitmap=await createImageBitmap(file);const scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();return canvas.toDataURL('image/jpeg',.84)}function renderPhotos(){ $('photoPreview').innerHTML=draftPhotos.map((src,i)=>`<div class="photo-wrap"><img src="${src}" alt="添付写真${i+1}"><button type="button" data-remove-photo="${i}">× 削除</button></div>`).join('')}
function cutForm(c){$('cutForm').reset();const sortedPeople=[...state.people].sort((a,b)=>(a.reading||a.name).localeCompare(b.reading||b.name,'ja',{sensitivity:'base',numeric:true}));$('cutPerson').innerHTML=sortedPeople.map(p=>`<option value="${esc(p.id)}">${esc(p.reading?`${p.reading}　—　${p.name}`:p.name)}</option>`).join('');$('cutPerson').value=c?.personId||activePersonId||sortedPeople[0]?.id||'';$('cutId').value=c?.id||'';$('cutFormTitle').textContent=c?'記録を編集':'カットの記録';$('cutDate').value=c?.date||today();$('style').value=c?.style||'';$('salon').value=c?.salon||'';$('price').value=c?.price??'';$('memo').value=c?.memo||'';draftPhotos=[...(c?.photos||[])];renderPhotos();showModal('cutModal')}
$('addPersonBtn').onclick=()=>personForm();$('personSearch').oninput=render;$('facilityFilter').onchange=render;$('peopleList').onclick=async e=>{const b=e.target.closest('[data-open-person]');if(b){showDetail(b.dataset.openPerson);return}const ed=e.target.closest('[data-edit-person]');if(ed){const p=state.people.find(x=>x.id===ed.dataset.editPerson);if(p)personForm(p);return}const del=e.target.closest('[data-delete-person]');if(del){const p=state.people.find(x=>x.id===del.dataset.deletePerson);if(!p)return;const count=state.cuts.filter(c=>c.personId===p.id).length;if(confirm(`「${p.name}」を削除しますか？関連するカット記録${count}件と写真もすべて削除されます。この操作は元に戻せません。`)){const old=state;state={people:state.people.filter(x=>x.id!==p.id),cuts:state.cuts.filter(x=>x.personId!==p.id)};try{await saveState();if(activePersonId===p.id)showPeople();render();notify('利用者と関連記録を削除しました')}catch{state=old;notify('削除を保存できませんでした')}}}};$('backBtn').onclick=showPeople;$('editPersonBtn').onclick=()=>{const p=state.people.find(x=>x.id===activePersonId);if(p)personForm(p)};$('personForm').onsubmit=async e=>{e.preventDefault();const parsedBirth=normaliseBirthDate($('birthDate').value);$('birthDate').setCustomValidity(parsedBirth.error);if(parsedBirth.error){$('birthDate').reportValidity();return}const id=$('personId').value||crypto.randomUUID();const p={id,name:$('personName').value.trim(),reading:$('personReading').value.trim(),facilityId:ensureFacility($('personFacility').value),gender:$('gender').value,birthDate:parsedBirth.value};state.people=state.people.filter(x=>x.id!==id);state.people.push(p);try{await saveState();closeModal('personModal');render();if(activePersonId===id)renderDetail();notify('利用者情報を保存しました')}catch(err){notify('保存できませんでした。端末の空き容量をご確認ください')}};$('addCutBtn').onclick=()=>cutForm();$('cutSearch').oninput=renderDetail;$('cutForm').onsubmit=async e=>{e.preventDefault();const id=$('cutId').value||crypto.randomUUID();const c={id,personId:$('cutPerson').value,date:$('cutDate').value,style:$('style').value.trim(),salon:$('salon').value.trim(),price:$('price').value,memo:$('memo').value.trim(),photos:draftPhotos};const previous=state.cuts;state.cuts=state.cuts.filter(x=>x.id!==id);state.cuts.push(c);activePersonId=c.personId;try{await saveState();closeModal('cutModal');render();notify('写真を含めて記録を保存しました')}catch(err){state.cuts=previous;notify('保存できませんでした。写真の容量を減らしてお試しください')}};
$('cameraBtn').onclick=()=>$('cameraInput').click();$('galleryBtn').onclick=()=>$('galleryInput').click();async function addPhotoFiles(files){for(const file of [...files]){try{draftPhotos.push(await shrinkImage(file))}catch(err){notify(err.message||'写真を読み込めませんでした')}}renderPhotos()}$('cameraInput').onchange=async e=>{await addPhotoFiles(e.target.files);e.target.value=''};$('galleryInput').onchange=async e=>{await addPhotoFiles(e.target.files);e.target.value=''};$('photoPreview').onclick=e=>{const b=e.target.closest('[data-remove-photo]');if(b){draftPhotos.splice(Number(b.dataset.removePhoto),1);renderPhotos()}};$('cutList').onclick=async e=>{const edit=e.target.closest('[data-edit-cut]'),del=e.target.closest('[data-delete-cut]');if(edit){const c=state.cuts.find(x=>x.id===edit.dataset.editCut);if(c)cutForm(c)}if(del){const c=state.cuts.find(x=>x.id===del.dataset.deleteCut);if(c&&confirm(`「${c.style}」の記録を削除しますか？写真も削除されます。`)){state.cuts=state.cuts.filter(x=>x.id!==c.id);try{await saveState();render();notify('記録を削除しました')}catch{notify('削除を保存できませんでした')}}}};
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'髪ログ',version:2,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`kami-log-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('写真を含むバックアップを書き出しました')};$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const raw=JSON.parse(await f.text());let incomingPeople=raw.people,incomingCuts=raw.cuts,incomingFacilities=raw.facilities||[];if(raw.app!=='髪ログ'&&Array.isArray(raw.records)){const legacy=raw.records;const personId='legacy-self';incomingPeople=[{id:personId,name:'自分',gender:'',birthDate:'',facilityId:''}];incomingFacilities=[];incomingCuts=legacy.map(x=>({id:x.id||crypto.randomUUID(),personId,date:x.date,style:x.style,salon:x.salon||'',price:x.price||'',memo:x.memo||'',photos:[]}))}if(!Array.isArray(incomingFacilities)||!Array.isArray(incomingPeople)||!Array.isArray(incomingCuts)||!incomingFacilities.every(f=>f&&f.id&&f.name)||!incomingPeople.every(p=>p&&p.id&&p.name)||!incomingCuts.every(c=>c&&c.id&&c.personId&&c.date&&c.style&&Array.isArray(c.photos||[]))){throw Error('format')}const totalPhotos=incomingCuts.reduce((n,c)=>n+(c.photos||[]).length,0);if(!confirm(`${incomingPeople.length}人、${incomingCuts.length}件、写真${totalPhotos}枚を読み込みます。同じIDの情報は置き換わり、それ以外は追加されます。続けますか？`))return;const facilities=new Map(state.facilities.map(x=>[x.id,x]));incomingFacilities.forEach(x=>facilities.set(x.id,x));const people=new Map(state.people.map(x=>[x.id,x]));incomingPeople.forEach(x=>people.set(x.id,x));const cuts=new Map(state.cuts.map(x=>[x.id,x]));incomingCuts.forEach(x=>cuts.set(x.id,{...x,photos:x.photos||[]}));const old=state;state={facilities:[...facilities.values()],people:[...people.values()],cuts:[...cuts.values()]};await saveState();render();notify('バックアップを写真ごと復元しました')}catch(err){alert('このファイルは読み込めませんでした。髪ログのバックアップJSONか確認してください。')}finally{e.target.value=''}};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)closeModal(m.id)});async function init(){try{db=await openDB();state=await readState();if(!Array.isArray(state.people))state.people=[];if(!Array.isArray(state.cuts))state.cuts=[];if(!Array.isArray(state.facilities))state.facilities=[];const legacy=localStorage.getItem('kamilog.records.v1');if(legacy&&state.cuts.length===0){try{const records=JSON.parse(legacy);if(records.length){const personId=crypto.randomUUID();state.people.push({id:personId,name:'自分',gender:'',birthDate:''});state.cuts.push(...records.map(x=>({id:x.id||crypto.randomUUID(),personId,date:x.date,style:x.style,salon:x.salon||'',price:x.price||'',memo:x.memo||'',photos:[]})));await saveState()}}catch{}}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(err){document.querySelector('.privacy').innerHTML='<strong>端末保存を開始できませんでした。</strong><br>ブラウザのプライベートモードを解除し、通常モードで開き直してください。';notify('このブラウザでは端末内保存を利用できません')}}init();
</script></body></html>
